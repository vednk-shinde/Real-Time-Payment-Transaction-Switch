spring:
  application:
    name: transaction-switch
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:txswitch}
    username: ${DB_USER:txswitch}
    password: ${DB_PASSWORD:txswitch}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: transaction-audit
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # ErrorHandlingDeserializer: a poison message is logged and skipped instead of blocking the partition forever.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.paymentswitch.model
  data:
    web:
      pageable:
        max-page-size: 100

app:
  kafka:
    topic: transaction-events
    partitions: 3
  jwt:
    # Override with the JWT_SECRET env var anywhere outside local development (>= 32 bytes).
    secret: ${JWT_SECRET:change-me-in-production-0123456789abcdef}
    expiration-minutes: 60
  rate-limit:
    capacity: 20
    refill-per-second: 10
  risk:
    max-amount: 10000.00
  seed-demo-users: ${SEED_DEMO_USERS:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
